name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 CLI يتطلب NodeJS 22 أو أحدث
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3 يفشل لأن حزمة "tools" حُذفت من مستودع أندرويد؛ v4 يثبّت platform-tools فقط
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install Capacitor
        run: npm ci

      # نسخ ملفات اللعبة إلى www/ بنفس السكربت المستعمل محلياً (مصدر واحد للحقيقة)
      - name: Prepare web assets
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GangCity-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
