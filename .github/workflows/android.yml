name: Build Android APK

# التطبيق بـ Flutter (flutter_game/، القسم 18): ملف APK للجوالات بمعالج 64 بت، موقَّع بمفتاح التجربة
# (gangcity-debug.keystore) فيُثبَّت فوق النسخ السابقة ويبقى الحفظ
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Tests
        working-directory: flutter_game
        run: flutter test

      - name: Build APK
        working-directory: flutter_game
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GangCity-apk
          path: flutter_game/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
