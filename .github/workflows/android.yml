# المسار في المستودع: .github/workflows/android.yml  (يحل محل ملف Godot القديم)
# يبني تطبيق أندرويد من نفس كود المتصفح عبر Capacitor، ويرفع ملف APK في Artifacts.
# مسودة: شغّلها، واقرأ سجل الخطأ إن فشلت، وعدّلها حتى تنجح.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # إصدارات Capacitor الحديثة تحتاج JDK 21 — عدّلها إن طلب البناء غير ذلك
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      # نسخ ملفات اللعبة فقط إلى www — بلا node_modules ولا android ولا docs
      - name: Prepare web assets
        run: |
          rm -rf www && mkdir www
          cp index.html www/
          cp -r css js www/ 2>/dev/null || true
          [ -d assets ] && cp -r assets www/ || true
          [ -f docs/audio.js ] && mkdir -p www/docs && cp docs/audio.js www/docs/ || true
          [ -f docs/units-art.js ] && mkdir -p www/docs && cp docs/units-art.js www/docs/ || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GangCity-apk
          path: android/app/build/outputs/apk/debug/*.apk
