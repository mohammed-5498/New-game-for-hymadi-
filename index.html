<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#34302b">
<title>مدينة العصابات</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">

  <!-- شاشة المباراة -->
  <div id="screenGame" hidden>
    <canvas id="game"></canvas>

    <div id="info">
      <span id="infoSel">محدد: 0</span>
      <span class="sep">|</span>
      <span id="infoUnits">0/100</span>
      <span class="sep">|</span>
      <span id="infoDistricts">أحياء: 0</span>
      <span class="sep">|</span>
      <span id="infoWeather">نهار</span>
    </div>

    <button id="btnMode" class="btn" style="top:10px;right:10px">تحريك الخريطة</button>
    <button id="btnPause" class="btn" style="top:10px;left:50%;transform:translateX(-50%)">إيقاف</button>
    <button id="btnAll" class="btn" style="bottom:10px;right:10px">كل جنودي</button>
    <button id="btnClear" class="btn" style="bottom:10px;right:120px">إلغاء التحديد</button>

    <div id="notice" hidden></div>
    <div id="fps" hidden></div>

    <!-- قائمة الإيقاف -->
    <div id="pauseMenu" hidden>
      <div class="panel">
        <h1>إيقاف مؤقت</h1>
        <button id="btnResume" class="wide">متابعة</button>
        <button id="btnRestartMatch" class="wide ghost">إعادة المباراة</button>
        <button id="btnQuitToMain" class="wide ghost">القائمة الرئيسية</button>
      </div>
    </div>

    <!-- شاشة النهاية -->
    <div id="endScreen" hidden>
      <div class="panel">
        <h1 id="endTitle"></h1>
        <ul id="endStats"></ul>
        <button id="btnRestart" class="wide">مباراة جديدة</button>
        <button id="btnEndToMain" class="wide ghost">القائمة الرئيسية</button>
      </div>
    </div>
  </div>

  <!-- القائمة الرئيسية -->
  <div id="screenMain">
    <div class="menu">
      <h1 class="title">مدينة العصابات</h1>
      <p class="subtitle">عصابات تتقاتل للسيطرة على أحياء المدينة</p>
      <button id="btnPlay" class="wide">لعب</button>
    </div>
  </div>

  <!-- قائمة الإعداد -->
  <div id="screenSetup" hidden>
    <div class="menu setup">
      <h2>إعداد المباراة</h2>

      <div class="row">
        <span class="label">حجم الخريطة</span>
        <div id="optMapSize" class="options"></div>
      </div>

      <div class="row">
        <span class="label">الحد الأقصى للوحدات</span>
        <div id="optMaxUnits" class="options"></div>
      </div>

      <div class="row">
        <span class="label">الطقس</span>
        <div id="optWeather" class="options"></div>
      </div>

      <div class="row">
        <span class="label">مؤثرات الصوت</span>
        <div id="optSfx" class="options"></div>
      </div>

      <div class="row">
        <span class="label">الموسيقى</span>
        <div id="optMusic" class="options"></div>
      </div>

      <div class="row">
        <span class="label">كتم الصوت</span>
        <div id="optMute" class="options"></div>
      </div>

      <div class="slots-head">
        <span>اللاعبون</span>
        <span id="slotsHint" class="hint"></span>
      </div>
      <div id="slots"></div>

      <!-- شريط سفلي ثابت حتى يبقى زر "ابدأ" في متناول الإصبع دائماً -->
      <div class="setup-footer">
        <p id="setupError" class="error" hidden></p>
        <div class="footer-row">
          <button id="btnStart" class="wide">ابدأ</button>
          <button id="btnBackToMain" class="wide ghost">رجوع</button>
        </div>
      </div>
    </div>
  </div>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
