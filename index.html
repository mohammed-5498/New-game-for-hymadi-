<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#34302b">
<title>مدينة العصابات</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- شريط المعلومات (أعلى اليسار) -->
  <div id="info">
    <span id="infoSel">محدد: 0</span>
    <span class="sep">|</span>
    <span id="infoUnits">0/100</span>
    <span class="sep">|</span>
    <span id="infoDistricts">أحياء: 0</span>
    <span class="sep">|</span>
    <span id="infoWeather">نهار</span>
  </div>

  <!-- زر تبديل وضع الإصبع الواحد -->
  <button id="btnMode" class="btn" style="top:10px;right:10px">تحريك الخريطة</button>

  <!-- أزرار تجريبية للمرحلة 1 فقط (تُستبدل بقوائم الإعداد في المرحلة 6) -->
  <button id="btnWeather" class="btn tmp" style="top:62px;right:10px">الطقس: نهار</button>
  <button id="btnNewMap" class="btn tmp" style="bottom:10px;left:10px">خريطة جديدة</button>

  <button id="btnAll" class="btn" style="bottom:10px;right:10px">كل جنودي</button>
  <button id="btnClear" class="btn" style="bottom:10px;right:120px">إلغاء التحديد</button>

  <!-- إشعار قصير عند الاستيلاء على حي -->
  <div id="notice" hidden></div>

  <!-- شاشة النهاية -->
  <div id="endScreen" hidden>
    <div class="panel">
      <h1 id="endTitle"></h1>
      <ul id="endStats"></ul>
      <button id="btnRestart">مباراة جديدة</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
