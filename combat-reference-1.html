<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>مرجع القتال الواقعي v2</title>
<style>:root{--text-primary:#2b2825;--text-secondary:#6b665c;--surface-1:#fff;--surface-2:#fff;--border:#d6d2c8;--bg-accent:#dbe8fb;--text-accent:#1b4f9c}
body{margin:0;padding:12px;font-family:system-ui,sans-serif;background:#f3f1ec}button{border:1px solid #cfc9bd;border-radius:8px}</style></head><body>
<!-- مرجع القتال الواقعي v2 — نظام الوضعيات المفتاحية.
     الأنميشن: anim2 (BASE/GUARD/ATK/DODGE/BLOCK/poseWalk/poseIdle/poseStagger/addFlinch/drawBody).
     الوحدات: U2. الربط بحالة القتال: poseOf و drawOne. المنطق: قسم "القتال الواقعي — تنفيذ مرجعي". -->
<div dir="rtl" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">
<button id="mShow" style="min-height:40px;padding:0 14px;font-size:13px">عرض الحركات</button>
<button id="mBattle" style="min-height:40px;padding:0 14px;font-size:13px">معركة</button>
<button id="sl" style="min-height:40px;padding:0 12px;font-size:13px;background:var(--surface-2)">حركة بطيئة</button>
<button id="nb" style="min-height:40px;padding:0 12px;font-size:13px;background:var(--surface-2)">معركة جديدة</button>
<button id="dbg" style="min-height:40px;padding:0 12px;font-size:13px;background:var(--surface-2)">إظهار التفاصيل</button>
</div>
<div id="showRow" dir="rtl" style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:5px"><span id="acts" style="display:contents"></span></div>
<div id="unitRow" dir="rtl" style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:6px"><span id="units" style="display:contents"></span></div>
<canvas id="cv" style="width:100%;height:420px;display:block"></canvas>
<script>
/* ===================== نظام الأنميشن v2: وضعيات مفتاحية (Keyframe Poses) =====================
   بدل ذراع واحدة تتأرجح، كل حركة تُعرَّف بوضعيات مفتاحية للجسم كله:
   الحوض، أسفل العمود وأعلاه، الرأس وميله، اليدان (بحل عكسي IK للمرفق)، زاوية السلاح، والساقان.
   تُمزج الوضعيات بسلاسة، فيصبح لكل ضربة وتفادٍ وصدّ شكل مختلف فعلاً. */
const TAU=6.2831853,WOOD='#8a6a45',STEEL='#b9bec5',DARKW='#5f646b',SKIN='#d9a77a';
const Pf=(c,f)=>{c.fillStyle=f;c.fill();};
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
function dk(h,a){const n=parseInt(h.slice(1),16);
  return '#'+((1<<24)+(Math.round(((n>>16)&255)*(1-a))<<16)+(Math.round(((n>>8)&255)*(1-a))<<8)+Math.round((n&255)*(1-a))).toString(16).slice(1);}
function lt(h,a){const n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return '#'+((1<<24)+(Math.round(r+(255-r)*a)<<16)+(Math.round(g+(255-g)*a)<<8)+Math.round(b+(255-b)*a)).toString(16).slice(1);}
function limb(c,x1,y1,x2,y2,w,col){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke();}
function bone3(c,a,b,d,w,col){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(d[0],d[1]);
  c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.stroke();}
function ell(c,x,y,rx,ry,f){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);Pf(c,f);}
function rrect(c,x,y,w,h,r,f){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);Pf(c,f);}
function tri(c,a,b,d,f){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(d[0],d[1]);c.closePath();Pf(c,f);}
const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
function ik2(o,t,L1,L2,flip){let dx=t[0]-o[0],dy=t[1]-o[1],d=Math.hypot(dx,dy)||0.001;
  const cl=Math.max(Math.abs(L1-L2)+0.05,Math.min(d,L1+L2-0.05)),ex=o[0]+dx/d*cl,ey=o[1]+dy/d*cl,a=Math.atan2(ey-o[1],ex-o[0]);
  const A=Math.acos(Math.max(-1,Math.min(1,(L1*L1+cl*cl-L2*L2)/(2*L1*cl)))),g=a+(flip?A:-A);
  return {j:[o[0]+Math.cos(g)*L1,o[1]+Math.sin(g)*L1],e:[ex,ey]};}

/* ---------- الوضعيات ----------
   px,py الحوض | pl ميل أسفل العمود | cb انحناء أعلى العمود | ht ميل الرأس | hdx,hdy إزاحة الرأس
   fh,bh اليد الأمامية والخلفية | wa زاوية السلاح (0 للأمام، سالب للأعلى) | tf,kf / tb,kb فخذ وركبة الساق الأمامية/الخلفية */
const BASE={px:0,py:-11,pl:0.05,cb:0,ht:0,hdx:0,hdy:0,fh:[3.5,-6.5],bh:[-2.5,-6.5],wa:0.9,tf:0.13,kf:0.16,tb:-0.13,kb:0.16,air:0};
const GUARD={px:0,py:-10.3,pl:0.12,cb:0.06,ht:0.05,fh:[5,-11],bh:[1.5,-9.5],wa:-1.05,tf:0.38,kf:0.5,tb:-0.5,kb:0.38};
function P(o){return Object.assign({},BASE,GUARD,o);}
function mixPose(a,b,t){const r={};for(const k in a){const va=a[k],vb=b[k]===undefined?va:b[k];
  r[k]=Array.isArray(va)?[va[0]+(vb[0]-va[0])*t,va[1]+(vb[1]-va[1])*t]:va+(vb-va)*t;}return r;}
function keyPose(keys,t){if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){const [t0,p0]=keys[i-1],[t1,p1]=keys[i];return mixPose(p0,p1,ease((t-t0)/(t1-t0)));}
  return keys[keys.length-1][1];}

/* الضربات: مفاتيح على الخط الزمني القياسي (0 حراسة، 0.34 قمة الاستعداد، 0.44 الارتطام، 0.53 نهاية التجمّد، 1 حراسة) */
const G=P({});
const ATK={
  quick:[[0,G],
    [0.34,P({pl:0.02,cb:-0.28,ht:-0.12,fh:[-2,-13.5],bh:[3,-10],wa:-2.6,tf:0.3,kf:0.5,tb:-0.5,kb:0.3})],
    [0.44,P({px:1.6,pl:0.22,cb:0.38,ht:0.18,fh:[9,-10],bh:[-3.5,-8],wa:0.15,tf:0.62,kf:0.4,tb:-0.72,kb:0.25})],
    [0.53,P({px:1.6,pl:0.22,cb:0.4,ht:0.2,fh:[9.4,-9.2],bh:[-3.5,-8],wa:0.35,tf:0.62,kf:0.4,tb:-0.72,kb:0.25})],[1,G]],
  heavy:[[0,G],
    [0.34,P({py:-11.8,pl:-0.14,cb:-0.4,ht:-0.35,fh:[-1,-26],bh:[-3,-21.5],wa:-2.05,tf:0.2,kf:0.3,tb:-0.4,kb:0.3})],
    [0.40,P({py:-11,pl:0.05,cb:0.1,ht:-0.1,fh:[5,-23.5],bh:[1,-19],wa:-1.0,tf:0.45,kf:0.45,tb:-0.6,kb:0.3})],
    [0.44,P({px:2.4,py:-8.8,pl:0.32,cb:0.62,ht:0.38,fh:[10,-4.5],bh:[5,-6],wa:1.1,tf:0.85,kf:0.75,tb:-0.85,kb:0.3})],
    [0.53,P({px:2.4,py:-8.8,pl:0.32,cb:0.64,ht:0.4,fh:[10.2,-4],bh:[5,-5.5],wa:1.2,tf:0.85,kf:0.75,tb:-0.85,kb:0.3})],[1,G]],
  thrust:[[0,G],
    [0.34,P({px:-1.2,pl:-0.02,cb:-0.12,ht:-0.05,fh:[-3.5,-10.5],bh:[2,-11],wa:0,tf:0.28,kf:0.62,tb:-0.3,kb:0.52})],
    [0.44,P({px:3.4,pl:0.36,cb:0.26,ht:0.12,fh:[13,-11],bh:[-6.5,-8.5],wa:0,tf:0.9,kf:0.35,tb:-0.95,kb:0.2})],
    [0.53,P({px:3.4,pl:0.36,cb:0.28,ht:0.12,fh:[13.6,-11],bh:[-6.5,-8.5],wa:0.02,tf:0.9,kf:0.35,tb:-0.95,kb:0.2})],[1,G]],
  spin:[[0,G],
    [0.34,P({py:-9.4,pl:-0.06,cb:-0.22,ht:-0.1,fh:[-8,-12],bh:[-5,-11],wa:3.0,tf:0.5,kf:0.85,tb:-0.5,kb:0.85})],
    [0.39,P({py:-9.6,pl:0.05,cb:0,fh:[0,-14],bh:[-2,-13],wa:-1.6,tf:0.5,kf:0.85,tb:-0.5,kb:0.85})],
    [0.44,P({px:1.2,py:-9.4,pl:0.26,cb:0.3,ht:0.1,fh:[10.5,-11],bh:[7,-10.5],wa:0.2,tf:0.6,kf:0.8,tb:-0.6,kb:0.8})],
    [0.53,P({px:1.2,py:-9.4,pl:0.26,cb:0.32,fh:[11,-9],bh:[7.5,-9],wa:0.6,tf:0.6,kf:0.8,tb:-0.6,kb:0.8})],[1,G]]
};
/* التفادي بنوعين: قفزة للخلف، أو انحناء تحت الضربة */
const DODGE={
  leap:[[0,P({py:-9.3,pl:0.26,cb:0.12,fh:[5,-9],bh:[2,-9],tf:0.6,kf:1.05,tb:-0.4,kb:1.05})],
    [0.38,P({px:-2.2,py:-14.8,pl:-0.36,cb:-0.48,ht:-0.5,hdx:-0.6,fh:[1,-18.5],bh:[-6.5,-15],wa:-2.2,tf:0.95,kf:1.45,tb:0.1,kb:1.35,air:1})],
    [0.78,P({px:-1,py:-9.8,pl:-0.08,cb:0,ht:0.12,fh:[4,-12],bh:[-3,-11],tf:0.5,kf:0.95,tb:-0.5,kb:0.95})],[1,G]],
  duck:[[0,G],
    [0.32,P({py:-6.4,pl:0.52,cb:0.58,ht:0.4,hdy:1,fh:[3,-6],bh:[-4.5,-5],wa:-0.2,tf:1.0,kf:1.95,tb:-0.62,kb:1.85})],
    [0.7,P({py:-6.8,pl:0.46,cb:0.5,ht:0.3,hdy:0.8,fh:[3.5,-6.5],bh:[-4,-5.5],wa:-0.3,tf:0.95,kf:1.85,tb:-0.6,kb:1.75})],[1,G]]
};
/* الصدّ بالدرع: الدرع للأمام والرأس مختبئ خلفه */
const BLOCK=[[0,G],[0.22,P({py:-10,pl:0.2,cb:0.26,ht:0.34,hdx:-0.9,fh:[7.5,-12.5],bh:[3,-9],tf:0.55,kf:0.72,tb:-0.82,kb:0.3})],
  [1,P({py:-10,pl:0.18,cb:0.22,ht:0.3,hdx:-0.8,fh:[7,-12],bh:[3,-9],tf:0.5,kf:0.7,tb:-0.8,kb:0.3})]];

function poseIdle(t,combat){if(combat){const b=Math.sin(t*4.2);
    return Object.assign(P({}),{py:-10.3+b*0.3,cb:0.06+b*0.03,fh:[5,-11+b*0.4],bh:[1.5,-9.5+b*0.3],ht:0.05-b*0.03});}
  const b=Math.sin(t*2.6);return Object.assign({},BASE,{py:-11+b*0.3,cb:b*0.03,ht:-b*0.04,fh:[3.5,-6.5+b*0.3],bh:[-2.5,-6.5+b*0.3]});}
function poseWalk(t,spd,combat){const p=t*2.55*spd*TAU,s=Math.sin(p),c2=Math.cos(p*2);
  const r=Object.assign({},combat?P({}):BASE);
  r.py=-11.6-c2*1.4;r.pl=0.28;r.cb=0.1+c2*0.04;r.ht=-0.12-c2*0.05;r.air=Math.max(0,Math.sin(p*2))*0.55;
  r.tf=0.95*s;r.kf=1.55*Math.pow(0.5+0.5*Math.cos(p-4.12),2.2)+0.18;
  r.tb=0.95*Math.sin(p+Math.PI);r.kb=1.55*Math.pow(0.5+0.5*Math.cos(p+Math.PI-4.12),2.2)+0.18;
  if(combat){r.fh=[5.5+s*-1.2,-11.5+c2*0.6];r.bh=[-1+s*3,-8.5];r.wa=-1.0+s*0.15;}
  else{r.fh=[1.5-s*4.5,-7+Math.abs(s)*1.2];r.bh=[-1.5+s*4.5,-7+Math.abs(s)*1.2];r.wa=0.9-s*0.5;}
  return r;}
function poseStagger(t,d){return P({px:-1.8*d,py:-10.4,pl:-0.18-0.16*Math.sin(t*20)*d,cb:-0.48*d,ht:-0.58*d+Math.sin(t*14)*0.22*d,
  fh:[6+Math.sin(t*11)*2.2,-15.5+Math.cos(t*9)*2],bh:[-6.5,-14+Math.sin(t*13)*2],wa:-2.2+Math.sin(t*10)*0.4,tf:0.1,kf:0.42,tb:-0.55,kb:0.42});}
function addFlinch(p,f,fromBack){const s=fromBack?-1:1;p=Object.assign({},p);
  p.cb-=0.38*f*s;p.ht-=0.55*f*s;p.px-=1.3*f*s;p.fh=[p.fh[0]-1.6*f,p.fh[1]-1.4*f];p.bh=[p.bh[0]-1.2*f,p.bh[1]-1.6*f];return p;}
function poseDeath(){return P({py:-9,pl:0.3,cb:0.55,ht:0.65,fh:[4,-3],bh:[-2,-3],wa:1.3,tf:0.55,kf:1.0,tb:-0.45,kb:1.0});}

/* ---------- رسم الجسد من الوضعية ---------- */
function leg(c,hx,hy,th,fl,W,col){const k=[hx+Math.sin(th)*5.8,hy+Math.cos(th)*5.8];
  const f=[k[0]+Math.sin(th-fl)*6,k[1]+Math.cos(th-fl)*6];bone3(c,[hx,hy],k,f,W,col);
  limb(c,f[0],f[1],f[0]+Math.sin(th-fl+1.1)*2,f[1]+Math.cos(th-fl+1.1)*0.9,W,col);}
function drawBody(c,p,col,o){
  const W=o.lw||2,dc=dk(col,0.32),hp=[p.px,p.py];
  const M=add(hp,rot(0,-4.6,p.pl)),a2=p.pl+p.cb,C=add(M,rot(0,-4.6,a2)),N=add(C,rot(0,-1.3,a2));
  const ha=a2+p.ht,H=add(add(N,rot(0,-3.1,ha)),[p.hdx,p.hdy]);
  const Sb=add(C,rot(-0.9,0.7,a2)),Sf=add(C,rot(0.9,0.5,a2));
  const J={hip:hp,mid:M,chest:C,neck:N,head:H,ha,Sf,Sb,a2};
  leg(c,p.px-1.2,p.py,p.tb,p.kb,W,dc);
  o.backWeapon&&o.backWeapon(c,J,p,col);
  const b=ik2(Sb,p.bh,3.7,3.7,true);bone3(c,Sb,b.j,b.e,W-0.1,dc);J.handB=b.e;
  o.back&&o.back(c,J,p,col);
  bone3(c,hp,M,C,W+0.5,col);limb(c,C[0],C[1],N[0],N[1],W*0.8,col);
  o.chest&&o.chest(c,J,p,col);
  leg(c,p.px+1.2,p.py,p.tf,p.kf,W,col);
  c.save();c.translate(H[0],H[1]);c.rotate(ha);
  c.beginPath();c.arc(0,0,o.headR||3,0,TAU);Pf(c,col);c.lineWidth=0.7;c.strokeStyle=dk(col,0.4);c.stroke();
  ell(c,1.5,-0.3,0.55,0.55,dk(col,0.6));                      // العين تُظهر اتجاه الرأس
  o.head&&o.head(c,p,col);c.restore();
  const f=ik2(Sf,p.fh,3.7,3.7,true);J.handF=f.e;J.elbowF=f.j;
  o.weapon&&o.weapon(c,J,p,col);
  bone3(c,Sf,f.j,f.e,W,col);
  o.front&&o.front(c,J,p,col);
  return J;}

/* ===================== الوحدات على نظام الوضعيات v2 ===================== */
const wdir=a=>[Math.cos(a),Math.sin(a)];
const U2={
  crow_common:{sx:0.92,sy:1.08,lw:1.9,headR:2.9,wlen:3.8,
    head(c,p,col){c.beginPath();c.moveTo(-3.4,0.9);c.quadraticCurveTo(-0.4,-5.4,3.1,0.1);c.lineTo(2.1,-0.7);
      c.quadraticCurveTo(-0.3,-3.3,-2.5,1);c.closePath();Pf(c,dk(col,0.45));},
    back(c,J,p,col){const fl=Math.sin((p.py+p.px)*2)*1.2;
      tri(c,add(J.chest,[-0.8,0.6]),add(J.hip,[-6.2+fl,2+(p.air||0)*-3]),add(J.hip,[-0.6,0.4]),dk(col,0.25));},
    weapon(c,J,p){const d=wdir(p.wa),e=[J.handF[0]+d[0]*3.8,J.handF[1]+d[1]*3.8];
      limb(c,J.handF[0],J.handF[1],e[0],e[1],1.4,STEEL);}},
  hammer_common:{sx:1.18,sy:0.94,lw:2.6,headR:3.1,wlen:4.8,
    head(c,p,col){c.beginPath();c.arc(0,-0.3,3.4,Math.PI,0);Pf(c,dk(col,0.5));rrect(c,-3.4,-0.8,7,1.2,0.3,dk(col,0.5));},
    chest(c,J,p,col){const l=add(J.chest,rot(-4.4,0.8,J.a2)),r=add(J.chest,rot(4.4,0.8,J.a2));limb(c,l[0],l[1],r[0],r[1],2.4,dk(col,0.2));},
    weapon(c,J,p){const d=wdir(p.wa),e=[J.handF[0]+d[0]*4.8,J.handF[1]+d[1]*4.8];
      limb(c,J.handF[0],J.handF[1],e[0],e[1],1.5,WOOD);
      c.save();c.translate(e[0],e[1]);c.rotate(p.wa);rrect(c,-1,-2,3,4,0.7,STEEL);c.restore();}},
  hammer_shield:{sx:1.22,sy:0.93,lw:3,headR:3.2,wlen:3,
    head(c,p,col){c.beginPath();c.arc(0,-0.3,3.5,Math.PI,0);Pf(c,dk(col,0.5));rrect(c,-3.5,-0.8,7,1.4,0.3,'#5d6169');},
    chest(c,J,p,col){const l=add(J.chest,rot(-4.8,0.8,J.a2)),r=add(J.chest,rot(4.8,0.8,J.a2));limb(c,l[0],l[1],r[0],r[1],2.8,dk(col,0.2));},
    front(c,J,p,col){c.save();c.translate(J.handF[0]+1.2,J.handF[1]);c.rotate(J.a2*0.6);
      rrect(c,-2.8,-7.6,5.6,15.2,1.8,lt(col,0.25));rrect(c,-1.6,-6,3.2,12,1,dk(col,0.15));
      ell(c,0.2,0,1.4,1.4,lt(col,0.55));c.restore();}},
  hammer_breaker:{sx:1.22,sy:0.94,lw:3,headR:3.2,wlen:12,twoH:true,
    head(c,p,col){rrect(c,-3.4,-2,6.8,2,0.5,dk(col,0.5));},
    chest(c,J,p,col){const l=add(J.chest,rot(-4.8,0.8,J.a2)),r=add(J.chest,rot(4.8,0.8,J.a2));limb(c,l[0],l[1],r[0],r[1],2.8,dk(col,0.2));},
    weapon(c,J,p){const d=wdir(p.wa),s=[J.handF[0]-d[0]*3.4,J.handF[1]-d[1]*3.4],e=[J.handF[0]+d[0]*8.6,J.handF[1]+d[1]*8.6];
      limb(c,s[0],s[1],e[0],e[1],1.8,WOOD);
      c.save();c.translate(e[0],e[1]);c.rotate(p.wa);rrect(c,-2.4,-3.4,5,6.8,1.1,DARKW);rrect(c,-2.4,-3.4,1.8,6.8,0.9,'#9aa0a8');c.restore();}}
};
/* الطول الفعلي من اليد لرأس السلاح (لمكان الشرر والأثر) */
function tipOf(ud,J,p){const d=wdir(p.wa),L=ud.twoH?8.6:ud.wlen;return [J.handF[0]+d[0]*L,J.handF[1]+d[1]*L];}

/* ===================== القتال الواقعي — تنفيذ مرجعي (القسم 5.4) =====================
   هذا منطق كامل يعمل. انقله إلى js/game/combat.js وادمجه مع الوحدات الحقيقية.
   كل الأرقام في CR (تُنقل إلى config.js تحت combatRealism). */
const TILE=30;                                   // بكسل لكل مربع في هذا المرجع فقط
const CR={
  dodgeBase:0.18, blockBase:0.35,
  stMax:100, stRegen:20, dodgeCost:35, blockCost:25, dodgeCd:1.2,
  frontHalf:60*Math.PI/180, sideHalf:120*Math.PI/180,   // أمام ±60° = قوس 120°، جانب حتى ±120°
  angleMul:{front:1, side:0.5, back:0}, dmgMul:{front:1, side:1.10, back:1.25},
  dodgeDist:0.8, dodgeTime:0.30, blockTime:0.30,
  staggerBump:0.30, staggerBlocked:0.25, jitter:0.15,
  traits:{aggr:[0.7,1.3], dodgeSkill:[0.7,1.3], react:[0.10,0.35], spd:[0.93,1.07], size:[0.96,1.04]},
  moves:{
    quick :{wind:0.18,strike:0.08,hold:0.05,rec:0.25,dmg:0.7,rangeAdd:0,  arc:100,sAmp:0.85,lunge:0.8},
    heavy :{wind:0.45,strike:0.10,hold:0.09,rec:0.55,dmg:1.6,rangeAdd:0,  arc:110,sAmp:1.20,lunge:1.25,stagger:0.40,knock:1.0},
    thrust:{wind:0.30,strike:0.07,hold:0.06,rec:0.35,dmg:1.0,rangeAdd:0.6,arc:50, sAmp:0.60,lunge:1.6},
    spin  :{wind:0.50,strike:0.15,hold:0.05,rec:0.60,dmg:0.8,rangeAdd:0.2,arc:360,sAmp:1.10,lunge:0.4}
  },
  maxRagdolls:20,
  flinchTime:0.2, flinchKnock:0.15,          // ارتداد خفيف مرئي مع كل ضربة عادية
  clashChance:0.6, clashWindow:0.08, clashKnock:0.45, clashStagger:0.2   // تصادم الأسلحة
};
const DEFS={
  crow_common   :{hp:100,armor:0,   dmg:10,range:1.0,speed:2.5,turn:8,flank:0.85,moves:['quick','heavy','thrust']},
  hammer_common :{hp:120,armor:0.15,dmg:10,range:1.0,speed:2.2,turn:4,flank:0.25,moves:['quick','heavy','thrust']},
  hammer_shield :{hp:320,armor:0.5, dmg:8, range:1.0,speed:1.6,turn:3,flank:0,   moves:['quick','heavy'],block:true},
  hammer_breaker:{hp:200,armor:0.2, dmg:22,range:1.2,speed:1.8,turn:3,flank:0.1, moves:['quick','heavy','spin']}
};
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
function rng32(seed){let s=seed>>>0;return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const lerp=(r,[a,b])=>a+(b-a)*r();

function makeUnit(id,team,key,x,y,seed){
  const r=rng32(seed),d=DEFS[key];
  return {id,team,key,def:d,x,y,face:team===0?0:Math.PI,hp:d.hp,maxHp:d.hp,
    st:'idle',stT:0,move:null,moveT:0,hitDone:false,target:null,
    stam:CR.stMax,dodgeCd:0,react:null,cooldown:r()*0.5,rng:r,
    traits:{aggr:lerp(r,CR.traits.aggr),skill:lerp(r,CR.traits.dodgeSkill),react:lerp(r,CR.traits.react),
            spd:lerp(r,CR.traits.spd),size:lerp(r,CR.traits.size)},
    vx:0,vy:0,dvx:0,dvy:0,dead:false,deadT:0,animT:r()*3,moving:false,flash:0,blockFlash:0,bumpCd:0,flinch:0,clashFx:0};
}
function createBattle(seed,W,H){
  const b={units:[],pops:[],W,H,t:0,over:false,winner:-1,ev:{dodge:0,block:0,back:0,side:0,bump:0,stagger:0,roll:0,hits:0,clash:0}};
  let id=0,s=seed;
  const crows=7,ham=['hammer_common','hammer_shield','hammer_common','hammer_breaker'];
  for(let i=0;i<crows;i++)b.units.push(makeUnit(id++,0,'crow_common',W*0.14+(i%2)*22,H*0.18+i*(H*0.64/(crows-1)),s++*7919));
  ham.forEach((k,i)=>b.units.push(makeUnit(id++,1,k,W*0.82-(i%2)*18,H*0.24+i*(H*0.52/(ham.length-1)),s++*104729)));
  return b;
}
function pop(b,x,y,txt,col){b.pops.push({x,y,txt,col,t:0});}
function zoneOf(t,fx,fy){const d=Math.abs(wrapA(Math.atan2(fy-t.y,fx-t.x)-t.face));
  return d<=CR.frontHalf?'front':d<=CR.sideHalf?'side':'back';}
function moveTotal(m){return m.wind+m.strike+m.hold+m.rec;}
function inRecovery(t){if(t.st==='stagger')return true;
  if(t.st!=='attack')return false;const m=CR.moves[t.move];return t.moveT>m.wind+m.strike+m.hold;}
function alive(b){return b.units.filter(u=>!u.dead);}

function chooseMove(u,t,dist,nearCount){
  let best=null,bs=-1e9;const low=u.hp/u.maxHp<0.3;
  for(const k of u.def.moves){const m=CR.moves[k],reach=(u.def.range+m.rangeAdd)*TILE+8;
    if(dist>reach)continue;
    let s=1;
    if(k==='quick')s=1.0+(low?1.0:0);
    if(k==='heavy')s=0.8+(inRecovery(t)?2.0:0)+(u.traits.aggr-1)*0.8-(low?0.5:0);
    if(k==='thrust')s=0.6+(dist>u.def.range*TILE*0.8?1.2:0);
    if(k==='spin')s=0.2+(nearCount>=3?2.5:nearCount===2?0.6:0);
    s*=1+(u.rng()*2-1)*CR.jitter;
    if(s>bs){bs=s;best=k;}}
  return best;
}
function startAttack(b,u,k){
  u.st='attack';u.move=k;u.moveT=0;u.hitDone=false;
  const t=u.target;
  if(t&&!t.dead&&!t.react&&t.st!=='stagger'&&t.st!=='dodge'&&t.st!=='block')t.react={at:t.traits.react,from:u};
}
function tryReact(b,u,a){          // الوحدة رأت الاستعداد، هل تتفادى أو تصدّ؟
  if(a.dead||a.st!=='attack'||a.hitDone)return;
  // يتفادى من كان منتظراً، أو في أول نصف استعداده فيلغي ضربته. المترنّح ومن في التعافي لا يتفادى
  const earlyWind=u.st==='attack'&&u.moveT<CR.moves[u.move].wind*0.5;
  if(u.st!=='idle'&&u.st!=='walk'&&!earlyWind)return;
  const zone=zoneOf(u,a.x,a.y),mul=CR.angleMul[zone];
  if(mul<=0)return;                                  // من الخلف: لا يرى ولا يتفادى
  if(u.def.block&&zone==='front'&&u.stam>=CR.blockCost&&u.rng()<CR.blockBase*u.traits.skill){
    u.st='block';u.stT=CR.blockTime;u.stam-=CR.blockCost;pop(b,u.x,u.y,'صدّ!','#8fd0ff');b.ev.block++;return;}
  if(u.stam>=CR.dodgeCost&&u.dodgeCd<=0&&u.rng()<CR.dodgeBase*u.traits.skill*mul){
    // نوع التفادي: الطعنة تُتفادى بالقفز للخلف، والتلويح والضربة القوية بالانحناء تحتها غالباً
    u.dodgeType=a.move==='thrust'?'leap':(u.rng()<0.55?'duck':'leap');
    const away=Math.atan2(u.y-a.y,u.x-a.x)+(u.rng()*2-1)*1.2;
    const sp=CR.dodgeDist*TILE/CR.dodgeTime*(u.dodgeType==='duck'?0.3:1);
    u.st='dodge';u.stT=CR.dodgeTime;u.dvx=Math.cos(away)*sp;u.dvy=Math.sin(away)*sp;
    u.stam-=CR.dodgeCost;u.dodgeCd=CR.dodgeCd;pop(b,u.x,u.y,'تفادى!','#b8f0a8');b.ev.dodge++;}
}
function knock(u,fromX,fromY,tiles){const a=Math.atan2(u.y-fromY,u.x-fromX),v=tiles*TILE*8;
  u.vx+=Math.cos(a)*v;u.vy+=Math.sin(a)*v;}
function die(b,t,a,k){t.dead=true;t.st='death';t.deadT=0;t.react=null;
  const big=k==='heavy'||k==='spin';knock(t,a.x,a.y,big?1.4:0.6);if(big)b.ev.roll++;}
function resolveHit(b,a){
  a.hitDone=true;const m=CR.moves[a.move],reach=(a.def.range+m.rangeAdd)*TILE+10;
  let tg=[];
  if(a.move==='spin')tg=alive(b).filter(o=>o.team!==a.team&&Math.hypot(o.x-a.x,o.y-a.y)<=reach);
  else if(a.target&&!a.target.dead){const t=a.target,d=Math.hypot(t.x-a.x,t.y-a.y);
    const off=Math.abs(wrapA(Math.atan2(t.y-a.y,t.x-a.x)-a.face));
    if(d<=reach&&off<=m.arc*Math.PI/360+0.35)tg=[t];}
  // تصادم الأسلحة: إن كان الهدف يضربني في نفس اللحظة تقريباً ونحن متقابلان، تتصادم الضربتان
  if(tg.length===1&&a.move!=='spin'){const t=tg[0];
    if(t.st==='attack'&&!t.hitDone&&t.target===a&&zoneOf(t,a.x,a.y)==='front'&&zoneOf(a,t.x,t.y)==='front'){
      const tm=CR.moves[t.move],tHit=tm.wind+tm.strike*0.6;
      if(Math.abs(t.moveT-tHit)<=CR.clashWindow&&a.rng()<CR.clashChance){
        t.hitDone=true;
        for(const [p,q] of [[a,t],[t,a]]){p.st='stagger';p.stT=CR.clashStagger;p.react=null;knock(p,q.x,q.y,CR.clashKnock);}
        a.clashFx=t.clashFx=0.3;a.clashX=t.clashX=(a.x+t.x)/2;a.clashY=t.clashY=(a.y+t.y)/2;
        pop(b,(a.x+t.x)/2,(a.y+t.y)/2,'تصادم!','#ffe08a');b.ev.clash++;return;}}}
  for(const t of tg){
    if(t.st==='dodge')continue;                      // تفادى: الضربة تمر في الهواء
    const zone=zoneOf(t,a.x,a.y);
    if(t.st==='block'&&zone==='front'){              // صدّ: المهاجم يرتد ويترنّح
      t.blockFlash=0.2;a.st='stagger';a.stT=CR.staggerBlocked;knock(a,t.x,t.y,0.5);continue;}
    const dmg=a.def.dmg*m.dmg*CR.dmgMul[zone]*(1-t.def.armor)*(0.9+0.2*a.rng());
    t.hp-=dmg;t.flash=0.1;b.ev.hits++;
    if(zone==='back'){pop(b,t.x,t.y,'من الخلف!','#ff8a7a');b.ev.back++;}
    else if(zone==='side')b.ev.side++;
    if(t.hp<=0){die(b,t,a,a.move);continue;}
    if(m.stagger){t.st='stagger';t.stT=m.stagger;t.react=null;knock(t,a.x,a.y,m.knock);b.ev.stagger++;}
    else{t.flinch=CR.flinchTime;t.flinchBack=zone==='back';knock(t,a.x,a.y,CR.flinchKnock);}
  }
}
function step(b,dt){
  if(b.over)return;b.t+=dt;
  const live=alive(b);
  for(const u of b.units){
    u.flash=Math.max(0,u.flash-dt);u.blockFlash=Math.max(0,u.blockFlash-dt);u.flinch=Math.max(0,u.flinch-dt);u.clashFx=Math.max(0,u.clashFx-dt);u.bumpCd=Math.max(0,u.bumpCd-dt);
    u.x+=u.vx*dt;u.y+=u.vy*dt;const fr=Math.exp(-8*dt);u.vx*=fr;u.vy*=fr;
    u.x=Math.max(10,Math.min(b.W-10,u.x));u.y=Math.max(14,Math.min(b.H-6,u.y));
    if(u.dead){u.deadT+=dt;continue;}
    if(u.st!=='dodge')u.stam=Math.min(CR.stMax,u.stam+CR.stRegen*dt);
    u.dodgeCd=Math.max(0,u.dodgeCd-dt);u.cooldown=Math.max(0,u.cooldown-dt);
    if(u.react){u.react.at-=dt;if(u.react.at<=0){const f=u.react.from;u.react=null;tryReact(b,u,f);}}
    u.moving=false;
    if(u.st==='stagger'||u.st==='block'){u.stT-=dt;if(u.stT<=0)u.st='idle';continue;}
    if(u.st==='dodge'){u.x+=u.dvx*dt;u.y+=u.dvy*dt;u.stT-=dt;if(u.stT<=0)u.st='idle';continue;}
    const t=u.target;
    if(u.st==='attack'){
      if(t&&!t.dead){const want=Math.atan2(t.y-u.y,t.x-u.x),dA=wrapA(want-u.face);u.face+=Math.max(-2*dt,Math.min(2*dt,dA));}
      u.moveT+=dt;const m=CR.moves[u.move];
      if(!u.hitDone&&u.moveT>=m.wind+m.strike*0.6)resolveHit(b,u);
      if(u.moveT>=moveTotal(m)&&u.st==='attack'){u.st='idle';u.cooldown=(0.1+u.rng()*0.25)/u.traits.aggr;}
      continue;}
    // انتظار / حركة: اختيار الهدف (ثبات الهدف) والاقتراب أو الالتفاف
    if(!t||t.dead||Math.hypot(t.x-u.x,t.y-u.y)>TILE*9){
      let best=null,bs=1e9;
      for(const o of live){if(o.team===u.team)continue;
        const busy=o.target&&o.target!==u&&!o.target.dead?40*u.def.flank:0;
        const sc=Math.hypot(o.x-u.x,o.y-u.y)-busy;if(sc<bs){bs=sc;best=o;}}
      u.target=best;}
    const tg=u.target;if(!tg)continue;
    const dist=Math.hypot(tg.x-u.x,tg.y-u.y);
    let gx=tg.x,gy=tg.y;const R=u.def.range*TILE*0.85;
    const engagedElse=tg.target&&tg.target!==u&&!tg.target.dead;
    const fb=engagedElse?u.def.flank:u.def.flank*0.25;
    const bx=tg.x-Math.cos(tg.face)*R,by=tg.y-Math.sin(tg.face)*R;           // خلف الهدف
    const ang=Math.atan2(u.y-tg.y,u.x-tg.x),fx=tg.x+Math.cos(ang)*R,fy=tg.y+Math.sin(ang)*R;
    gx=fx+(bx-fx)*fb;gy=fy+(by-fy)*fb;
    const dx=gx-u.x,dy=gy-u.y,dd=Math.hypot(dx,dy),sp=u.def.speed*TILE*u.traits.spd;
    if(dd>3){const k=Math.min(1,sp*dt/dd);u.x+=dx*k;u.y+=dy*k;u.moving=true;}
    const want=Math.atan2(tg.y-u.y,tg.x-u.x),dA=wrapA(want-u.face),tr=u.def.turn*dt;
    u.face+=Math.max(-tr,Math.min(tr,dA));
    if(u.cooldown<=0&&Math.abs(wrapA(want-u.face))<0.6){
      const near=live.filter(o=>o.team!==u.team&&Math.hypot(o.x-u.x,o.y-u.y)<TILE*1.6).length;
      const k=chooseMove(u,tg,dist,near);if(k)startAttack(b,u,k);}
  }
  // التباعد، والاصطدام بالحلفاء عند الارتداد، والجثث المتدحرجة
  for(let i=0;i<b.units.length;i++)for(let j=i+1;j<b.units.length;j++){
    const a=b.units[i],c=b.units[j];if(a.dead&&c.dead)continue;
    const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||0.01;if(d>13)continue;
    const push=(13-d)*0.5,nx=dx/d,ny=dy/d;
    if(!a.dead&&!c.dead){a.x-=nx*push;a.y-=ny*push;c.x+=nx*push;c.y+=ny*push;}
    for(const [p,q] of [[a,c],[c,a]]){
      const spd=Math.hypot(p.vx,p.vy);
      if(spd>60&&!q.dead&&p.bumpCd<=0){
        if(!p.dead&&p.team===q.team&&q.st!=='stagger'&&q.st!=='dodge'){
          q.st='stagger';q.stT=CR.staggerBump;q.react=null;q.vx+=p.vx*0.5;q.vy+=p.vy*0.5;p.vx*=0.5;p.vy*=0.5;
          p.bumpCd=0.4;pop(b,q.x,q.y,'اصطدام!','#ffd66e');b.ev.bump++;}
        else if(p.dead){q.vx+=p.vx*0.4;q.vy+=p.vy*0.4;p.vx*=0.6;p.vy*=0.6;p.bumpCd=0.2;}}}
  }
  for(const p of b.pops)p.t+=dt;b.pops=b.pops.filter(p=>p.t<1.1);
  b.units=b.units.filter(u=>!(u.dead&&u.deadT>1.3));
  const teams=new Set(alive(b).map(u=>u.team));
  if(teams.size<=1){b.over=true;b.winner=teams.size?[...teams][0]:-1;}
}


/* ===================== ربط حالة القتال بالوضعيات ورسمها ===================== */
const MOVE_AR={quick:'سريعة',heavy:'قوية',thrust:'طعنة',spin:'دائرية'};
const ST_AR={dodge:'تفادٍ',block:'صدّ',stagger:'ترنّح'};
function canonA(u){const m=CR.moves[u.move],T=u.moveT,w=m.wind,k=m.strike,h=m.hold,r=m.rec;
  if(T<w)return 0.34*T/w;if(T<w+k)return 0.34+0.10*(T-w)/k;if(T<w+k+h)return 0.44+0.09*(T-w-k)/h;
  return Math.min(1,0.53+0.47*(T-w-k-h)/r);}
function poseOf(u){
  if(u.dead)return poseDeath();
  const t=u.target,combat=!!t&&!t.dead&&Math.hypot(t.x-u.x,t.y-u.y)<TILE*2.6;let p;
  if(u.st==='attack')p=keyPose(ATK[u.move],canonA(u));
  else if(u.st==='dodge')p=keyPose(DODGE[u.dodgeType||'leap'],1-u.stT/CR.dodgeTime);
  else if(u.st==='block'){p=keyPose(BLOCK,1-u.stT/CR.blockTime);const im=u.blockFlash/0.2;
    if(im>0){p=Object.assign({},p);p.cb-=0.35*im;p.px-=1.6*im;p.ht-=0.2*im;p.fh=[p.fh[0]-1.8*im,p.fh[1]];}}
  else if(u.st==='stagger')p=poseStagger(u.animT,Math.min(1,Math.max(0,u.stT)/0.4));
  else p=u.moving?poseWalk(u.animT,u.def.speed/2.2,combat):poseIdle(u.animT,combat);
  if(u.flinch>0)p=addFlinch(p,Math.sin(Math.PI*u.flinch/CR.flinchTime),u.flinchBack);
  return p;}
function twoHand(ud,p){if(!ud.twoH)return p;const d=wdir(p.wa);p=Object.assign({},p);p.bh=[p.fh[0]-d[0]*3.2,p.fh[1]-d[1]*3.2];return p;}
function drawOne(c,u,sx,sy,sc,alpha){
  const ud=U2[u.key],col=TEAM_COL[u.team];let p=twoHand(ud,poseOf(u));
  let dir=Math.cos(u.face)>=0?1:-1;
  const a=u.st==='attack'?canonA(u):-1;
  if(u.st==='attack'&&u.move==='spin'&&a>0.35&&a<0.42)dir=-dir;       // لفّة كاملة بصرياً
  const sz=u.traits.size;
  c.save();c.globalAlpha=alpha==null?1:alpha;c.translate(sx,sy);c.scale(sc*dir*ud.sx*sz,sc*ud.sy*sz);
  if(u.dead){const k=ease(Math.min(1,u.deadT*1.25));c.globalAlpha*=u.deadT>0.72?Math.max(0,1-(u.deadT-0.72)/0.28):1;
    ell(c,0,0.6,4*(1+k*0.5),1.6,'rgba(0,0,0,0.3)');c.translate(-k*3.4,0);c.rotate(-k*1.5708);}
  else{const s=1-(p.air||0)*0.35;ell(c,0,0.6,(ud.twoH?4.6:3.8)*s,1.6*s,'rgba(0,0,0,'+(0.3*s)+')');}
  if(u.st==='attack'&&u.move==='spin'&&a>0.34&&a<0.62){const g=(a-0.34)/0.28;c.save();c.globalAlpha*=Math.max(0,1-g)*0.85;
    c.beginPath();c.ellipse(0,-5,13+g*7,5.5+g*2.6,0,0,TAU);c.strokeStyle='#ffe08a';c.lineWidth=1.8;c.stroke();c.restore();}
  if(a>=0.34&&a<0.55){for(let i=3;i>=1;i--){const pa=twoHand(ud,keyPose(ATK[u.move],a-i*0.028));const d=wdir(pa.wa);
      const L=ud.twoH?8.6:ud.wlen,s0=ud.twoH?[pa.fh[0]-d[0]*3.4,pa.fh[1]-d[1]*3.4]:pa.fh;
      c.save();c.globalAlpha*=0.14*(4-i);limb(c,s0[0],s0[1],pa.fh[0]+d[0]*L,pa.fh[1]+d[1]*L,ud.twoH?2.2:1.6,'#f3eee2');c.restore();}}
  const J=drawBody(c,p,col,ud);
  if(a>=0.42&&a<0.6&&ud.weapon){const g=1-(a-0.42)/0.18,t=tipOf(ud,J,p);c.save();c.globalAlpha*=g*0.95;
    for(let i=0;i<6;i++){const an=i*1.047+0.3;limb(c,t[0],t[1],t[0]+Math.cos(an)*(2+g*3.6),t[1]+Math.sin(an)*(2+g*3.6),0.9,'#ffe08a');}
    ell(c,t[0],t[1],1.2+g*2.2,1.2+g*2.2,'rgba(255,236,170,'+(g*0.7)+')');c.restore();}
  if(u.flash>0){c.save();c.globalAlpha*=Math.min(1,u.flash/0.1)*0.55;ell(c,J.chest[0],J.chest[1]-1,5.5,9,'#ffffff');
    ell(c,J.head[0],J.head[1],3.6,3.6,'#ffffff');c.restore();}
  if(u.st==='block'&&u.blockFlash>0){const g=u.blockFlash/0.2,h=J.handF;c.save();c.globalAlpha*=g;
    c.beginPath();c.arc(h[0]+3,h[1],5+(1-g)*6,-1.1,1.1);c.strokeStyle='#bfe2ff';c.lineWidth=1.6;c.stroke();
    for(let i=0;i<5;i++){const an=-0.9+i*0.45;limb(c,h[0]+4,h[1],h[0]+4+Math.cos(an)*(4+(1-g)*5),h[1]+Math.sin(an)*(4+(1-g)*5),0.9,'#ffffff');}c.restore();}
  if(u.st==='stagger'){for(let i=0;i<3;i++){const an=u.animT*8+i*2.1,x=J.head[0]+Math.cos(an)*4.6,y=J.head[1]-4.6+Math.sin(an)*1.4;
    tri(c,[x-1,y],[x,y-1.6],[x+1,y],'#ffd66e');tri(c,[x-1,y],[x,y+1.6],[x+1,y],'#ffd66e');}}
  c.restore();}

/* ===================== واجهة العرض: وضعان — عرض الحركات عن قرب، ومعركة ===================== */
const TEAM_COL=['#8a5cc7','#d9463b'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,slow=1,debug=false,bt=null,overT=0,mode='show',act='heavy',ukey='crow_common';
const AW=400,AH=260;
const ACTS=[['quick','ضربة سريعة'],['heavy','ضربة قوية'],['thrust','طعنة'],['spin','ضربة دائرية'],
  ['leap','تفادٍ بالقفز'],['duck','تفادٍ بالانحناء'],['block','صدّ'],['stagger','ترنّح'],['flinch','ارتداد الإصابة']];
const UNITS=[['crow_common','غراب'],['hammer_common','مطرقة'],['hammer_shield','مصفّح'],['hammer_breaker','محطِّم']];
function resize(){W=cv.clientWidth||360;H=cv.clientHeight||440;dpr=window.devicePixelRatio||1;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
function chips(id,list,get,set){const box=document.getElementById(id);box.innerHTML='';
  list.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;
    b.style.cssText='min-height:36px;padding:0 10px;font-size:12px';
    const paint=()=>{const on=get()===k;b.style.background=on?'var(--bg-accent)':'var(--surface-2)';b.style.color=on?'var(--text-accent)':'var(--text-primary)';};
    b.addEventListener('click',()=>{set(k);refresh();});b._p=paint;box.appendChild(b);});}
function refresh(){document.querySelectorAll('#acts button,#units button').forEach(b=>b._p&&b._p());
  document.getElementById('showRow').style.display=mode==='show'?'flex':'none';
  document.getElementById('unitRow').style.display=mode==='show'?'flex':'none';
  document.getElementById('nb').style.display=mode==='battle'?'':'none';
  document.getElementById('dbg').style.display=mode==='battle'?'':'none';
  ['mShow','mBattle'].forEach(id=>{const on=(id==='mShow')===(mode==='show'),b=document.getElementById(id);
    b.style.background=on?'var(--bg-accent)':'var(--surface-2)';b.style.color=on?'var(--text-accent)':'var(--text-primary)';});}
chips('acts',ACTS,()=>act,k=>act=k);chips('units',UNITS,()=>ukey,k=>ukey=k);
function newBattle(){bt=createBattle(Math.floor(Math.random()*1e6),AW,AH);overT=0;}
document.getElementById('mShow').addEventListener('click',()=>{mode='show';refresh();});
document.getElementById('mBattle').addEventListener('click',()=>{mode='battle';newBattle();refresh();});
document.getElementById('nb').addEventListener('click',newBattle);
document.getElementById('sl').addEventListener('click',function(){slow=slow===1?0.3:1;this.textContent=slow===1?'حركة بطيئة':'سرعة عادية';});
document.getElementById('dbg').addEventListener('click',function(){debug=!debug;this.textContent=debug?'إخفاء التفاصيل':'إظهار التفاصيل';});
const css=getComputedStyle(document.documentElement);
const CT=(css.getPropertyValue('--text-primary')||'#2b2825').trim(),CS=(css.getPropertyValue('--text-secondary')||'#6b665c').trim();
const CB=(css.getPropertyValue('--border')||'#d6d2c8').trim(),CSF=(css.getPropertyValue('--surface-1')||'#f5f3ee').trim();
newBattle();refresh();
/* ---- عرض الحركات: وحدة كبيرة تكرر الحركة المختارة ---- */
const demo={};
function demoUnit(key){if(!demo[key]){demo[key]=makeUnit(99,key==='crow_common'?0:1,key,0,0,4242);demo[key].face=0;}return demo[key];}
let st0=0;
function showFrame(t){
  const u=demoUnit(ukey),team=u.team;u.dead=false;u.flash=0;u.blockFlash=0;u.flinch=0;u.moving=false;u.animT=t;u.target=null;
  let valid=true;
  if(['quick','heavy','thrust','spin'].includes(act)){
    if(!u.def.moves.includes(act))valid=false;
    const m=CR.moves[act],tot=moveTotal(m)+0.5,lt=t%tot;
    u.st=lt<moveTotal(m)?'attack':'idle';u.move=act;u.moveT=lt;u.target=u;}
  else if(act==='leap'||act==='duck'){const cyc=CR.dodgeTime+0.7,lt=t%cyc;
    u.st=lt<CR.dodgeTime?'dodge':'idle';u.dodgeType=act;u.stT=CR.dodgeTime-lt;u.target=u;}
  else if(act==='block'){if(!u.def.block)valid=false;const cyc=1.1,lt=t%cyc;
    u.st=lt<0.9?'block':'idle';u.stT=Math.max(0.05,CR.blockTime-lt*0.3);u.blockFlash=lt>0.25&&lt<0.45?0.2-(lt-0.25):0;u.target=u;}
  else if(act==='stagger'){const cyc=1.2,lt=t%cyc;u.st=lt<0.5?'stagger':'idle';u.stT=0.5-lt;u.target=u;}
  else if(act==='flinch'){const cyc=0.9,lt=t%cyc;u.st='idle';u.target=u;
    if(lt<CR.flinchTime){u.flinch=CR.flinchTime-lt;u.flash=Math.max(0,0.1-lt);}}
  ctx.fillStyle=CSF;ctx.strokeStyle=CB;ctx.lineWidth=0.5;ctx.beginPath();
  (ctx.roundRect?ctx.roundRect(4,4,W-8,H-8,12):ctx.rect(4,4,W-8,H-8));ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(4,H*0.74,W-8,H*0.26-4);
  if(!valid){ctx.fillStyle=CS;ctx.font='13px system-ui,sans-serif';ctx.textAlign='center';ctx.direction='rtl';
    ctx.fillText('هذه الحركة ليست من حركات هذه الوحدة',W/2,H/2);return;}
  const sc=Math.min(W,H)/62;
  drawOne(ctx,u,W*0.45,H*0.74,sc);
  if(u.st==='dodge'){const off=(act==='leap'?-1:0);}
  ctx.fillStyle=CS;ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.direction='rtl';
  const lab=u.st==='attack'?(canonA(u)<0.34?'استعداد':canonA(u)<0.44?'ضرب':canonA(u)<0.53?'تجمّد الارتطام':'تعافٍ'):'';
  ctx.fillText(lab,W/2,H-14);}
let last=performance.now(),acc=0,showT=0;
function frame(now){resize();const real=Math.min(0.05,(now-last)/1000);last=now;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.textAlign='center';ctx.direction='rtl';
  if(mode==='show'){showT+=real*slow;showFrame(showT);requestAnimationFrame(frame);return;}
  acc+=real*slow;
  while(acc>=1/60){step(bt,1/60);for(const u of bt.units)u.animT+=1/60;acc-=1/60;}
  if(bt.over){overT+=real;if(overT>3.2)newBattle();}
  const sc=Math.min(W/AW,(H-40)/AH),ox=(W-AW*sc)/2,oy=26;
  ctx.fillStyle='#8d8577';ctx.beginPath();(ctx.roundRect?ctx.roundRect(ox,oy,AW*sc,AH*sc,10):ctx.rect(ox,oy,AW*sc,AH*sc));ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
  for(let x=0;x<=AW;x+=TILE){ctx.beginPath();ctx.moveTo(ox+x*sc,oy);ctx.lineTo(ox+x*sc,oy+AH*sc);ctx.stroke();}
  for(let y=0;y<=AH;y+=TILE){ctx.beginPath();ctx.moveTo(ox,oy+y*sc);ctx.lineTo(ox+AW*sc,oy+y*sc);ctx.stroke();}
  const Pp=u=>[ox+u.x*sc,oy+u.y*sc],us=[...bt.units].sort((a,b)=>a.y-b.y);
  if(debug)for(const u of us){if(u.dead)continue;const [x,y]=Pp(u);
    ctx.fillStyle=u.team?'rgba(217,70,59,0.12)':'rgba(138,92,199,0.14)';
    ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,TILE*1.3*sc,u.face-CR.frontHalf,u.face+CR.frontHalf);ctx.closePath();ctx.fill();}
  for(const u of us){const [x,y]=Pp(u),s=1.15*sc;
    if(u.st==='dodge'){for(let g=1;g<=2;g++)drawOne(ctx,u,x-u.dvx*0.035*g*sc,y-u.dvy*0.035*g*sc,s,0.18);}
    drawOne(ctx,u,x,y,s);}
  for(const u of us){if(!(u.clashFx>0))continue;const g=u.clashFx/0.3,x=ox+u.clashX*sc,y=oy+u.clashY*sc-14*sc;
    ctx.save();ctx.globalAlpha=g;ctx.strokeStyle='#fff3c0';ctx.lineWidth=1.6;
    for(let i=0;i<8;i++){const an=i*0.785,r1=3*sc,r2=(6+(1-g)*10)*sc;
      ctx.beginPath();ctx.moveTo(x+Math.cos(an)*r1,y+Math.sin(an)*r1);ctx.lineTo(x+Math.cos(an)*r2,y+Math.sin(an)*r2);ctx.stroke();}
    ctx.fillStyle='rgba(255,240,190,'+(g*0.7)+')';ctx.beginPath();ctx.arc(x,y,(2+(1-g)*4)*sc,0,6.2832);ctx.fill();ctx.restore();}
  for(const u of us){if(u.dead)continue;const [x,y]=Pp(u),bw=18*sc,top=y-36*sc*(U2[u.key].sy||1);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(x-bw/2,top,bw,3);
    ctx.fillStyle=TEAM_COL[u.team];ctx.fillRect(x-bw/2,top,bw*Math.max(0,u.hp/u.maxHp),3);
    if(debug){ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(x-bw/2,top+4,bw,2);
      ctx.fillStyle='#f0c04a';ctx.fillRect(x-bw/2,top+4,bw*u.stam/CR.stMax,2);
      const lab=u.st==='attack'?MOVE_AR[u.move]:ST_AR[u.st];
      if(lab){ctx.font='10px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(lab,x,top-3);}}}
  for(const p of bt.pops){ctx.globalAlpha=Math.max(0,1-p.t/1.1);
    ctx.font='500 12px system-ui,sans-serif';ctx.fillStyle=p.col;ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=3;
    const [x,y]=Pp(p);ctx.strokeText(p.txt,x,y-44*sc-p.t*22);ctx.fillText(p.txt,x,y-44*sc-p.t*22);}
  ctx.globalAlpha=1;const al=[0,0];for(const u of bt.units)if(!u.dead)al[u.team]++;
  ctx.font='500 13px system-ui,sans-serif';ctx.fillStyle=CT;ctx.fillText('الغربان '+al[0]+'  ·  المطارق '+al[1],W/2,16);
  if(bt.over){ctx.font='500 18px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=4;
    const tt=bt.winner===0?'انتصر الغربان':bt.winner===1?'انتصرت المطارق':'تعادل';ctx.strokeText(tt,W/2,oy+AH*sc/2);ctx.fillText(tt,W/2,oy+AH*sc/2);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

</script></body></html>
